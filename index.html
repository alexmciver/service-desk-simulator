<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Service Desk Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&display=swap" rel="stylesheet">
<style>
/* VOICE: a working help desk; calm, exact, a little ceremonial when you earn a certificate.
   IDEA: a Zoho-style workbench with desk email, live chat and phone-call channels, plus lab-bench evidence drawers.
   PICTURE: the open contact and its tool tabs, filling the first screen mid-use.
   COLOUR and TYPE: white ground, prussian band and actions, carmine for urgency and misses; Literata throughout.
   LAYOUT: desktop = queue | contact + tools | resolve; phone = queue → work → score with sticky context. */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0f1217);--ink:light-dark(#10131a,#e8ebf0);--mute:light-dark(#5a6170,#9aa3b2);--line:light-dark(#e1e4ea,#272c36);--panel:light-dark(#f5f6f8,#161a21);--pr:light-dark(#0b4f8a,#6aaae6);--prb:light-dark(#0b4f8a,#0b2b4d);--cr:light-dark(#c1121f,#ff6670);--ok:light-dark(#0b4f8a,#6aaae6);--con:light-dark(#0f1522,#0a0d12);--cont:#d6dde8}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Literata,Georgia,serif;overflow-x:clip;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
.band{padding:clamp(18px,3vw,36px) max(4vw,16px)}
header.band{background:var(--prb);color:#fff;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:end;justify-content:space-between;padding-top:max(clamp(18px,3vw,36px),env(safe-area-inset-top))}
h1{font-size:clamp(28px,4vw,40px);line-height:1.05;margin:0;font-weight:700;text-wrap:balance}
header p{margin:6px 0 0;opacity:.85;font-size:15px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:end}
.stat b{display:block;font-size:26px;line-height:1.1;white-space:nowrap}.stat span{font-size:13px;opacity:.85}
.cert{min-width:220px}.meter{height:8px;background:rgba(255,255,255,.22);border-radius:4px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:#fff}
.status{font-size:13px;opacity:.9;width:100%}
main{display:grid;grid-template-columns:270px minmax(0,1fr) 360px;gap:0;border-bottom:1px solid var(--line);max-width:1600px;margin:0 auto}
.queue{border-right:1px solid var(--line);padding:16px;background:var(--panel)}
.queue h2,.res h2,.foot h2{font-size:17px;margin:0 0 10px}
.qitem{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.qitem.on{border-color:var(--pr);box-shadow:inset 3px 0 0 var(--pr)}
.qitem .s{font-weight:600;font-size:15px;line-height:1.3;display:block}
.qitem .m{font-size:13px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.pri-Urgent,.pri-High{color:var(--cr);font-weight:600}
.gen{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.gen label{font-size:13px;color:var(--mute);display:block;margin-bottom:4px}
select,input[type=text],textarea{width:100%;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 16px;border-radius:6px;border:1px solid var(--pr);background:var(--pr);color:light-dark(#fff,#0f1217);font-weight:600}
.btn.ghost{background:transparent;color:var(--pr)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.w{width:100%;margin-top:8px}
.work{padding:18px clamp(14px,2vw,26px)}
.tk h2{font-size:clamp(24px,2.6vw,32px);line-height:1.1;margin:4px 0 12px;text-wrap:balance}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:13px;border:1px solid var(--line);border-radius:20px;padding:2px 10px;white-space:nowrap}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 18px;font-size:14px;padding:12px 0;border-block:1px solid var(--line);margin-bottom:12px}
.meta span{color:var(--mute);display:block;font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;min-height:44px;color:var(--mute);font-weight:600}
.tab.on{color:var(--ink);border-color:var(--pr)}.tab.seen:not(.on)::after{content:" ·";color:var(--pr)}
.body{white-space:pre-wrap;font-size:17px;max-width:68ch}
pre.con{background:var(--con);color:var(--cont);padding:14px 16px;border-radius:8px;overflow-x:auto;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.hintline{font-size:13px;color:var(--mute)}
.chip.ch{border-color:var(--pr);color:var(--pr);font-weight:600}
.mail{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:14px 16px;max-width:68ch}
.mail-h{font-size:13px;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px;display:grid;gap:4px}
.mail-h b{color:var(--ink);font-weight:600}
.call{border:1px solid var(--line);border-radius:12px;background:light-dark(#f0f4f8,#12161d);padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.call-bar{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--pr)}
.call-bar .dot{width:8px;height:8px;border-radius:50%;background:#1a7f37;box-shadow:0 0 0 3px rgba(26,127,55,.2)}
.chatlog{display:grid;gap:8px;margin-bottom:10px}
.row{display:flex;gap:8px}.row input{flex:1}
/* Chat/call bubbles — inbound grey, outbound Prussian */

.sms{display:flex;flex-direction:column;gap:8px;padding:14px 12px;border:1px solid var(--line);border-radius:12px;background:
  radial-gradient(120% 80% at 0% 0%,light-dark(#e8eef5,#1a2433) 0%,transparent 55%),
  light-dark(#eef1f5,#12161d);min-height:140px}
.sms-head{display:flex;align-items:center;gap:10px;padding:0 2px 8px;border-bottom:1px solid light-dark(#d5dbe5,#2a3140);margin-bottom:4px}
.sms-av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--prb);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.sms-who{font-weight:600;font-size:14px;line-height:1.2}.sms-who span{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.bubble{max-width:88%;padding:9px 12px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word;animation:pop .28s ease-out}
.bubble.in{align-self:flex-start;background:light-dark(#fff,#1e2430);border:1px solid var(--line);border-radius:16px 16px 16px 4px;color:var(--ink)}
.bubble.out{align-self:flex-end;background:var(--pr);color:light-dark(#fff,#0f1217);border-radius:16px 16px 4px 16px}
.bubble .meta-t{display:block;font-size:11px;opacity:.7;margin-top:4px}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sms-compose{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.sms-compose textarea{min-height:110px;resize:vertical;line-height:1.45;border-radius:18px;padding:12px 14px;border:1px solid var(--line);background:var(--bg)}
.sms-compose .sendrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sms-compose .sendrow .hintline{margin:0}
.res{border-left:1px solid var(--line);padding:16px;background:var(--panel)}
fieldset{border:0;padding:0;margin:0 0 16px}
legend{font-weight:600;font-size:15px;margin-bottom:6px;padding:0}
.opt{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);border-radius:6px;margin-bottom:5px;background:var(--bg);font-size:14.5px;line-height:1.4;cursor:pointer;min-height:44px}
.opt input{margin-top:3px;flex:none;width:18px;height:18px;accent-color:var(--pr)}
.seg{display:flex;flex-wrap:wrap;gap:5px}.seg .opt{flex:1 1 auto;margin:0;align-items:center}
.err{color:var(--cr);font-size:14px;min-height:1em}
.score{font-size:52px;font-weight:700;line-height:1;margin:6px 0}
.parts{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 14px}
.parts td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}.parts td:last-child{text-align:right;white-space:nowrap;padding-left:8px}
.miss{color:var(--cr)}.hit{color:var(--ok)}
.note{font-size:14px;margin:4px 0 10px}
details{border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:8px 0;background:var(--bg)}summary{cursor:pointer;font-weight:600;min-height:28px}
.foot{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:28px;max-width:1600px;margin:0 auto}
.foot-desk{display:contents}
.sk{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:14px;margin-bottom:6px}
.bar{height:10px;background:var(--panel);border:1px solid var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.sk b{text-align:right;font-weight:600;white-space:nowrap}
.certs li{padding:5px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;font-size:14px}.certs li.got{font-weight:700;color:var(--pr)}
ol,ul{margin:0;padding:0;list-style:none}
.hist li{font-size:14px;padding:5px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.empty{padding:30px 0;color:var(--mute)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r 1s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin,.bubble{animation:none}}
@media(max-width:1180px){main{grid-template-columns:240px minmax(0,1fr)}.res{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.foot{grid-template-columns:1fr 1fr}.foot>:first-child{grid-column:1/-1}}
/* Phone chrome: sticky ticket context + one primary action (hidden on desktop) */
.mbar,.monly,.mctx{display:none}
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:40;gap:8px;padding:10px max(4vw,16px) calc(10px + env(safe-area-inset-bottom));background:light-dark(rgba(255,255,255,.96),rgba(15,18,23,.96));border-top:1px solid var(--line);backdrop-filter:saturate(1.2) blur(8px)}
.mbar .btn{flex:1;margin:0}
#ctx{display:none}
.mctx{flex-direction:column;gap:2px;padding:8px max(4vw,16px) 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.mctx-sub{font-weight:700;font-size:15px;line-height:1.25;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mctx-line{font-size:12px;color:var(--mute);margin:0;display:flex;flex-wrap:wrap;gap:4px 10px}
.mctx-plan{font-size:12px;color:var(--mute);margin:2px 0 0;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.mctx-snip{font-size:13px;color:var(--ink);margin:4px 0 0;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:.9}
.mctx .pri-Urgent,.mctx .pri-High{font-weight:600}
.sheet{border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:8px 0}
.sheet>summary{list-style:none;cursor:pointer;font-weight:600;padding:10px 12px;min-height:44px;display:flex;align-items:center;justify-content:space-between}
.sheet>summary::-webkit-details-marker{display:none}
.sheet>summary::after{content:"Show";font-size:13px;font-weight:600;color:var(--pr)}
.sheet[open]>summary::after{content:"Hide"}
.sheet .sheet-body{padding:0 12px 12px;border-top:1px solid var(--line)}
.work-head{display:contents}
/* Phone: one path — queue, then work (messages + tools + resolve), then score */
@media(max-width:760px){
  header.band{position:sticky;top:0;z-index:30;gap:8px 12px;padding:max(8px,env(safe-area-inset-top)) max(4vw,16px) 8px}
  header.band h1{font-size:18px}
  header.band p,.status{display:none}
  .stats{gap:6px 12px}.stat b{font-size:16px}.stat span{font-size:11px}.cert{min-width:0;flex:1 1 100%}
  .cert b{font-size:15px}.meter{margin-top:4px}
  /* While working a ticket, drop the app band — the sticky context strip is the only chrome */
  body[data-mview=work] header.band,body[data-mview=score] header.band{display:none}
  main{grid-template-columns:1fr;border-bottom:0}
  .queue,.work,.res{padding:12px max(4vw,16px)}
  .queue{border-right:0;border-bottom:1px solid var(--line)}
  #qlist{display:flex;flex-direction:column;gap:8px;overflow:visible}
  .qitem{width:100%;margin:0}
  .tabs{gap:2px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .bubble{max-width:92%}
  .sms-compose textarea{min-height:140px}
  .sms-compose .sendrow{flex-wrap:wrap}.sms-compose .sendrow .btn{flex:1 1 100%}
  .res{border-left:0;border-top:1px solid var(--line);padding-bottom:max(24px,env(safe-area-inset-bottom));background:var(--bg)}
  #reply,.res h2,fieldset,.sms,#resolve-anchor{scroll-margin-top:130px}
  .foot{grid-template-columns:1fr;padding-bottom:max(24px,env(safe-area-inset-bottom));padding-top:8px}
  .foot-desk{display:none}
  .foot-inner{display:grid;gap:18px}
  .foot>.sheet{margin:0}
  .sk{grid-template-columns:minmax(0,1fr) 90px 56px}
  /* Phone work screen: context strip carries the ticket; drop duplicate title/chips/meta */
  .work-head{display:none}
  .md-meta{display:none}
  .mbar{display:flex}
  /* Sticky context lives between header and main so tools/SMS/triage never hide it */
  body[data-mview=work] #ctx,body[data-mview=score] #ctx{display:block;position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top);background:var(--bg)}
  body[data-mview=work] #ctx .mctx,body[data-mview=score] #ctx .mctx{display:flex}
  .mctx-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 4px}
  .mctx-nav button{background:none;border:0;color:var(--pr);font-weight:600;font-size:13px;padding:0;min-height:28px}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  /* Three surfaces only: queue | work (ticket+tools+resolve) | score */
  body[data-mview=queue] .work,body[data-mview=queue] .res{display:none}
  body[data-mview=work] .queue{display:none}
  /* Reply step: hide tools pane — sticky context + SMS compose only */
  body[data-mview=work][data-rstep=reply] .work{display:none}
  body[data-mview=work][data-rstep=reply] .res{border-top:0}
  /* Thread is on screen, so drop the long quote/plan from the strip */
  body[data-rstep=reply] .mctx-snip,body[data-rstep=reply] .mctx-plan{display:none}
  body[data-mview=score] .queue,body[data-mview=score] .work{display:none}
  body:not([data-mview=queue]) .foot{display:none}
  body[data-mview=queue] .mbar{display:none}
  .desk-submit{display:none}
  .res h2{font-size:18px;margin:0 0 10px}
  .opt{padding:8px 10px;margin-bottom:6px}
  /* Skills/career stay behind a sheet on the queue only */
  .monly{display:block}
}
</style></head><body>
<header class="band" id="hdr"></header>
<!-- Phone sticky ticket context; filled by renderCtx() so it stays visible over tools/SMS/triage -->
<div id="ctx" hidden></div>
<main>
  <section class="queue" aria-label="Ticket queue"><h2 id="qh">Queue</h2><div id="qlist"></div><div class="gen" id="gen"></div></section>
  <section class="work" id="work" aria-label="Ticket"></section>
  <aside class="res" id="res" aria-label="Resolution"></aside>
</main>
<section class="band foot" id="foot"></section>
<!-- Phone sticky primary action; filled by renderMbar() -->
<div class="mbar" id="mbar" hidden></div>

key:{opts:["The domain changed from www to non-www on Monday","The Black Friday sale starts this week","The money is reaching Stripe","Priya is updating orders by hand"],a:0},
ev:{site:"GET https://www.fenwickandfold.co.uk/?wc-api=wc_stripe\n→ 301 Moved Permanently\n→ https://fenwickandfold.co.uk/?wc-api=wc_stripe",logs:"WooCommerce › Status › Logs (stripe)\n  No webhook events received since Mon 23:12\n\nStripe dashboard › Webhooks\n  Endpoint: https://www.fenwickandfold.co.uk/?wc-api=wc_stripe\n  214 failed deliveries (HTTP 301)",admin:"WooCommerce › Payments › Stripe\n  Webhook URL to use: https://fenwickandfold.co.uk/?wc-api=wc_stripe\nSettings › General\n  Site Address: https://fenwickandfold.co.uk",code:"Nothing payment-related in functions.php.",dns:"www CNAME → fenwickandfold.co.uk\nRedirect rule: www → apex (301)"},keyTool:'logs',
dx:{opts:["Stripe is still sending payment confirmations to the old www address, and the redirect makes them fail","Stripe has suspended the account","WooCommerce needs an update","Customers are abandoning checkout"],a:0,why:"WooCommerce marks an order paid when Stripe's webhook arrives. Webhooks don't follow redirects, so every one since the domain switch has failed."},
fix:{opts:["Update the webhook endpoint in Stripe, resend the failed events, and confirm orders move to Processing","Reinstall the Stripe plugin","Switch the domain back to www","Bulk-mark every pending order as Processing"],a:0,why:"Resending failed events lets WooCommerce reconcile the stuck orders properly instead of guessing which were paid."},
hidden:"Priya changed the domain on Monday night with her marketing contact. Around 30 orders are affected. She isn't sure who set up Stripe originally but has the login.",
model:"Hi Priya,\n\nThanks for the detail about the domain change, that was the key. When a customer pays, Stripe sends a confirmation message back to your website, and that's what moves the order to Processing. Stripe was still sending those messages to the old www address, and since Monday they've been bouncing off the redirect, so your site never heard the payment had gone through.\n\nThe fix is to point Stripe at the new address, resend the missed confirmations so the stuck orders update themselves, and then place a test order to prove it's working before your sale. I'd estimate about an hour. You have 15 minutes left on this month's care plan, so the remaining 45 minutes would be billed at £40/hr (£30). If you're happy with that, reply here and I'll get it done today.\n\nUntil then, please don't bulk-change the pending orders, as resending the confirmations will sort them correctly.\n\nBest,\nAlex",
learn:"Payment gateways confirm orders by webhook. A domain, SSL or redirect change can break them silently, so check the gateway's webhook delivery log first.",url:"https://docs.stripe.com/webhooks"},
{id:'b3',channel:'call',desk:'Agency desk',p:'WordPress',area:'WordPress core & PHP',client:'Marlowe Community Trust',from:'Daniel Okafor, Comms Officer',subject:'"There has been a critical error on this website"',plan:'Support retainer · 4 hrs/month · 1 used',site:'marlowetrust.org.uk · WordPress 6.8',pri:'Urgent',bill:'covered',
body:"Morning,\n\nOur website is just showing 'There has been a critical error on this website' this morning. Nobody here has touched it since last week.\n\nWe did get an email on Friday from your server team saying PHP was being upgraded to 8.3 over the weekend, which I assume was fine?\n\nCould you look urgently? We've got a donation appeal going out at 2pm.\n\nDaniel",
key:{opts:["PHP was upgraded to 8.3 over the weekend","Nobody has touched the site since last week","A donation appeal goes out at 2pm","It's a charity site"],a:0},
ev:{site:"GET / → 500 Internal Server Error\nBody: There has been a critical error on this website.",logs:"PHP Fatal error: Uncaught Error: Call to undefined function create_function()\n  in /wp-content/plugins/event-rotator-lite/rotator.php:88",admin:"Recovery mode email sent to admin@marlowetrust.org.uk (Sat 03:02)\nPlugin: Event Rotator Lite 1.2, last updated 2017",code:"wp-config.php: WP_DEBUG false. No must-use plugins.",dns:"Nothing unusual."},keyTool:'logs',
dx:{opts:["An abandoned plugin uses a function removed in PHP 8, so it crashes the site","WordPress core files are corrupted","The server has run out of disk space","The theme licence has expired"],a:0,why:"create_function() was removed in PHP 8. The log names the exact plugin and line."},
fix:{opts:["Deactivate the plugin (recovery mode or rename its folder), confirm the site loads, then replace it with a maintained alternative tested on staging","Ask the server team to roll back to PHP 7.4 for good","Reinstall WordPress core","Restore last week's backup over the live site"],a:0,why:"Getting the site up takes minutes; the replacement is done properly on staging. Rolling PHP back leaves the site on an unsupported version."},
hidden:"The rotator plugin shows upcoming events on the homepage and they want to keep that feature. Daniel never saw the recovery mode email.",
model:"Hi Daniel,\n\nThe site is back up. The cause was an old add-on that shows your upcoming events on the homepage. It hasn't been updated since 2017 and isn't compatible with the newer, more secure server software installed at the weekend, so it stopped the whole site loading.\n\nI've switched that add-on off so you're safe for the 2pm appeal. The events strip will be missing from the homepage for now. Next, I'll set up a maintained replacement on our staging copy, check it with you, and then put it live, which I expect to take around an hour within your support plan.\n\nI'll update you here once the staging version is ready to review.\n\nKind regards,\nAlex",
learn:"\"Critical error\" after a PHP change: read the PHP error log for the plugin path. create_function(), each() and similar were removed in PHP 8.",url:"https://developer.wordpress.org/advanced-administration/debug/debug-wordpress/"},
{id:'b4',channel:'chat',desk:'Freelance',p:'Shopify',area:'Shopify apps & integrations',client:'Kestrel Outdoor',from:'Tom Reid, Ecommerce Lead',subject:'Old popup still showing after removing the app',plan:'Ad-hoc · £40/hr',site:'kestreloutdoor.co.uk · Shopify · Dawn 15 (customised)',pri:'Normal',bill:'adhoc',
body:"Hi Alex,\n\nWe uninstalled the Spinwheel discount app on Friday as we've moved to Klaviyo forms. The old wheel popup is still showing on the homepage, but only on our live theme. On the new theme I'm drafting for January it doesn't show at all.\n\nIt's slowing the page down too. PageSpeed flagged a script from spinwheel-cdn.\n\nCan you remove it? How long will it take?\n\nTom",
key:{opts:["It shows on the live theme but not the draft theme","They've moved to Klaviyo forms","The app was uninstalled on Friday","PageSpeed flagged a script"],a:0},
ev:{site:"Console: GET https://spinwheel-cdn.example/wheel.js 200 (from theme.liquid)\nLighthouse: Reduce unused JavaScript, wheel.js 182 KB",logs:"Apps › Uninstalled: Spinwheel Discounts (Fri)\nScript tags via Admin API: none remaining",admin:"Themes: 'Kestrel Live' (published, last edited 2022)\n        'January redesign' (draft, fresh Dawn install)",code:"layout/theme.liquid, line 214:\n{% render 'spinwheel-loader' %}\n<script src=\"https://spinwheel-cdn.example/wheel.js\" defer><\/script>\n\nsnippets/spinwheel-loader.liquid exists",dns:"Nothing relevant."},keyTool:'code',
dx:{opts:["The app's code was pasted into the live theme files, so uninstalling the app didn't remove it","Shopify is caching the old app","Klaviyo is loading the wheel","The app wasn't fully uninstalled"],a:0,why:"The draft theme is a fresh install without the pasted code, which is why it's clean. Older apps edited theme files directly."},
fix:{opts:["Duplicate the live theme, remove the render tag, script and snippet, preview, then publish","Reinstall the app and uninstall it again","Delete the lines straight from the live theme","Turn off Klaviyo forms"],a:0,why:"Working on a duplicate means nothing breaks for shoppers while you test."},
hidden:"Tom wants it gone before Thursday's newsletter. The live theme was set up by a previous agency. He'd like a fixed price if possible.",
model:"Hi Tom,\n\nThe popup is still there because the app's code was added directly into your live theme's files when it was installed, and uninstalling the app doesn't clean that up. Your January theme is a fresh copy, which is why it's not affected.\n\nI'll make a copy of the live theme, remove the leftover code there, check the homepage and run PageSpeed again, then publish it so nothing breaks for shoppers in the meantime. I'll also check for any other leftovers from the previous agency while I'm in there.\n\nThis should take about 45 minutes, so £30 at my £40/hr rate. I can have it done before Thursday's newsletter if you're happy to go ahead.\n\nBest,\nAlex",
learn:"Older apps injected code into theme files and uninstalling doesn't remove it. Modern apps use theme app extensions. Search the theme code for leftovers and work on a duplicate.",url:"https://shopify.dev/docs/apps/build/online-store/theme-app-extensions"},
{id:'b5',channel:'desk',desk:'Agency desk',p:'Shopify',area:'Shopify admin & checkout',client:'Bramble & Bee',from:'Lucy Hart, Founder',subject:'Discount code not working for some customers',plan:'Support retainer · 2 hrs/month · 0.5 used',site:'brambleandbee.com · Shopify',pri:'High',bill:'covered',
body:"Hello,\n\nWe sent the WINTER15 code out in our newsletter yesterday. It works when I test it, but we've had about ten emails from customers saying the code can't be used.\n\nLooking at their screenshots, they all seem to have something from the Sale collection in their basket, if that helps. We also have the 'Sale 20% off' automatic discount running this week.\n\nThanks,\nLucy",
key:{opts:["Customers with Sale items are also getting the automatic 20% discount","Lucy tested it and it worked","About ten customers emailed","The code went out in yesterday's newsletter"],a:0},
ev:{site:"Test checkout: Sale item + WINTER15\n→ \"This discount code couldn't be used with your existing discounts\"",logs:"Nothing relevant.",admin:"Discounts › WINTER15: 15% off order · Combinations: none\nDiscounts › Sale 20% off (automatic): product discount, Sale collection · Combinations: none",code:"Nothing relevant. Checkout isn't customisable on this plan.",dns:"Nothing relevant."},keyTool:'admin',
dx:{opts:["The two discounts aren't set to combine, so the code is blocked when the automatic one applies","The code has hit its usage limit","Customers are typing it in lowercase","The newsletter link is broken"],a:0,why:"Shopify only stacks discounts when each one allows combining with the other's class (product, order, shipping)."},
fix:{opts:["Check with Lucy whether they should stack; if yes, allow combinations on both and test with a Sale item","Delete the automatic discount","Create a brand new code","Tell customers to remove Sale items"],a:0,why:"Stacking costs margin, so it's the client's decision before it's a settings change."},
hidden:"Lucy is happy for them to stack this week only. Margins on sale items are tight.",
model:"Hi Lucy,\n\nThanks for spotting the Sale pattern, that's exactly it. Shopify won't let two discounts apply to the same order unless both are set to allow it. Customers with Sale items already get the automatic 20% off, so WINTER15 is being blocked. Your test basket didn't include a Sale item, which is why it worked for you.\n\nBefore I change anything: allowing them to combine means a Sale item could end up with both discounts. Would you like that for this week, or would you prefer WINTER15 to apply only to full-price items?\n\nOnce you confirm, it's about 15 minutes to update and test, covered by your support plan. I can also draft a short reply for the customers who emailed.\n\nKind regards,\nAlex",
learn:"\"Works for me\" usually means your test is different from the customer's. Recreate their exact basket. Discount combinations are set per discount.",url:"https://help.shopify.com/en/manual/discounts/combining-discounts"},
{id:'b6',channel:'chat',desk:'Freelance',p:'Shopify',area:'DNS, domains & email',client:'Oak & Ember Candles',from:'Rachel Moss, Owner',subject:'New domain sometimes shows a parked page',plan:'Launch package · go-live support included',site:'oakandember.co.uk · Shopify',pri:'High',bill:'covered',
body:"Hi Alex,\n\nI followed the Shopify steps and added the A record 23.227.38.65 at my domain company yesterday afternoon. I didn't delete anything as I wasn't sure what the other records did.\n\nSometimes the shop loads and sometimes I get the old 'this domain is parked' page. Is it just still updating?\n\nWe're announcing the launch on Instagram tomorrow morning.\n\nRachel",
key:{opts:["She didn't delete any of the existing records","She's announcing on Instagram tomorrow","She added the record yesterday afternoon","She followed Shopify's steps"],a:0},
ev:{site:"10 requests to oakandember.co.uk:\n  6 × Shopify storefront\n  4 × 'This domain is parked'",logs:"Shopify › Domains: oakandember.co.uk\n  Connection issue: additional A records found",admin:"Shopify › Domains: primary domain pending verification",code:"Nothing relevant.",dns:"oakandember.co.uk   A      23.227.38.65\noakandember.co.uk   A      185.53.177.20   (registrar parking)\nwww                 CNAME  parking.registrar-host.net"},keyTool:'dns',
dx:{opts:["The old parking A record is still there, so visitors are split between two servers","DNS just needs 72 hours to update","Shopify's servers are having problems","It's her browser cache"],a:0,why:"Two A records on one name means visitors get either address at random. That explains \"sometimes\", which propagation wouldn't."},
fix:{opts:["Remove the parking A record, point www at shops.myshopify.com, verify in Shopify and check with a DNS lookup","Wait another 48 hours","Move the nameservers to Shopify","Add a second Shopify A record"],a:0,why:"Removing the duplicate fixes the split; the www record is the second half of the job."},
hidden:"Rachel's domain is with a UK budget registrar. She can share a login or screenshots. There's no email on the domain yet.",
model:"Hi Rachel,\n\nYou did the right thing adding that record. The issue is that the domain company's original 'parked' record is still there alongside it, so visitors are randomly sent to either your shop or the parked page. That's why it works some of the time, and waiting won't fix it.\n\nTwo small changes are needed: remove the old parked record, and point the www version of your address at Shopify too. If you can share access to your domain account, or a screenshot of the records page, I'll make the changes, check them with a lookup tool and confirm everything in Shopify.\n\nThis is covered by your launch package, and once the changes are made it usually settles within an hour or two, so you'll be fine for tomorrow morning.\n\nBest,\nAlex",
learn:"\"Sometimes it works\" points to duplicate records, not propagation. Check every record on the name, not just the one you added.",url:"https://help.shopify.com/en/manual/domains/add-a-domain/connecting-domains/connect-domain-manual"}
,{id:'b7',channel:'desk',desk:'Agency desk',p:'WordPress',area:'Security & hacked sites',client:'Northgate Veterinary Clinic',from:'Helen Quayle, Practice Manager',subject:'Homepage redirects to a weird pharmacy site',plan:'Support retainer · 3 hrs/month · 1 used',site:'northgatevets.co.uk · WordPress 6.7',pri:'Urgent',bill:'covered',
body:"Alex,\n\nSome clients are saying our website sends them to a Chinese pharmacy page. When I look on my phone it looks fine. One of the nurses sent a screenshot and it is definitely our domain in the address bar before it jumps.\n\nWe haven't changed anything. Please treat this as urgent — people think we've been hacked.\n\nHelen",
key:{opts:["Visitors see a redirect to a pharmacy site while Helen's phone looks fine","They haven't changed anything","Nurses are worried","It's a veterinary clinic"],a:0},
ev:{site:"GET / (incognito) → 302 → hxxp://spam-pharma.example/sale\nGET / (logged-in admin cookie) → 200 OK clinic homepage",logs:"Access log: many GETs for /wp-content/uploads/2024/07/cache.php\nMalware scan: suspicious PHP in uploads",admin:"Wordfence: 1 critical — backdoor in uploads/cache.php\nUsers: admin + helen + a user 'wp_support' created 2 nights ago",code:"uploads/2024/07/cache.php — obfuscated eval() payload\n.htaccess has an injected RewriteRule at the top",dns:"Nothing unusual."},keyTool:'logs',
dx:{opts:["A backdoor in uploads is redirecting logged-out visitors","DNS was hijacked","The theme licence expired","Cloudflare is misconfigured"],a:0,why:"Admin sessions skip the injected redirect. The uploads PHP and new user are classic compromise signs."},
fix:{opts:["Take the site to maintenance, remove the backdoor and rogue user, reset passwords, restore clean files from a known backup on staging first, then harden uploads","Only delete cache.php and republish","Change the domain nameservers","Ignore it if Helen's phone looks fine"],a:0,why:"One file delete leaves other footholds. Clean restore plus credential reset is the safe path."},
hidden:"Helen uses the same password on a few sites. The 'wp_support' user was not created by anyone at the clinic. They have yesterday's backup.",
model:"Hi Helen,\n\nYou're right to treat this as urgent — the site has been compromised. Logged-out visitors were being redirected by malicious code hidden in the uploads folder; that's why it looked fine on your phone if you were still logged in.\n\nI've put the site into maintenance, removed the backdoor and a rogue admin user we didn't create, reset the admin passwords, and I'm restoring clean files from yesterday's backup on staging before putting them live. I'll also block PHP execution in uploads so this route is harder next time.\n\nThis is covered by your retainer for the emergency work today. I'll confirm once the clean homepage is live and send a short checklist for password hygiene.\n\nKind regards,\nAlex",
learn:"\"Fine for me, broken for clients\" on WordPress often means an admin cookie hiding a logged-out redirect malware. Check incognito and the uploads directory.",url:"https://wordpress.org/documentation/article/faq-my-site-was-hacked/"}
,{id:'b8',channel:'chat',desk:'Freelance',p:'WordPress',area:'Divi & page builders',client:'Harbour View B&B',from:'Mark Ellison, Owner',subject:'Mobile menu covers the Book Now button',plan:'Ad-hoc · £40/hr',site:'harbourviewbb.co.uk · Divi',pri:'Normal',bill:'adhoc',

,{id:'b9',channel:'call',desk:'Agency desk',p:'Shopify',area:'Shopify themes & Liquid',client:'Wool & Willow',from:'Sian Parry, Ops',subject:'Collection page shows raw Liquid on one filter',plan:'Support retainer · 2 hrs/month · 0.25 used',site:'woolandwillow.co.uk · Shopify · Horizon',pri:'High',bill:'covered',

dx:{opts:["A merge conflict left a Liquid example string as the filter label default","Shopify is down","The Midweight metafield was deleted","CDN cache is stale"],a:0,why:"The default filter string is the literal broken output; other filters supply real labels."},
fix:{opts:["Fix the snippet on a duplicate theme, preview the Midweight filter, publish, and hard-refresh the collection","Roll back the whole theme without checking","Ask customers to ignore it","Delete the Midweight filter"],a:0,why:"Duplicate-theme fix avoids a bad rollback and proves the chip before publish."},
hidden:"Sian can approve a theme publish. The developer is offline until Thursday.",
model:"Hi Sian,\n\nThanks for the call. The Midweight chip was printing a leftover bit of template code from last night's theme update — not a Shopify outage. Other filters were fine because they already had proper labels.\n\nI'll fix it on a copy of the live theme, preview the Midweight filter, then publish. About 20 minutes, covered by your retainer. I'll text you when the collection looks clean.\n\nKind regards,\nAlex",
learn:"Raw {{ ... }} in the storefront almost always means a quoted Liquid string or a failed output. Search the theme for the exact characters customers see.",url:"https://shopify.dev/docs/api/liquid"}
,{id:'b10',channel:'desk',desk:'Freelance',p:'Shopify',area:'Shopify apps & integrations',client:'Parcel & Pine',from:'Owen Blake, Founder',subject:'Klaviyo back-in-stock emails stopped',plan:'Care plan · 2 hrs/month · 1.5 used · overage £40/hr',site:'parcelandpine.com · Shopify',pri:'High',bill:'overage',
body:"Hi Alex,\n\nWe haven't had a back-in-stock email go out since we moved themes on Friday. Klaviyo shows the flow is live. Stock is coming back in daily and people are still signing up on the product page.\n\nCan you see what's wrong? We're over hours this month so flag the cost please.\n\nOwen",

ev:{site:"Product page: back-in-stock form renders\nNetwork: POST to Klaviyo BIS endpoint 200",logs:"Klaviyo › Back in stock: last event Friday 16:02\nShopify flow: inventory_level updated events OK",admin:"Klaviyo app: connected\nTheme app embeds: Back in stock embed OFF on live theme",code:"No custom BIS snippet in theme.liquid",dns:"Nothing relevant."},keyTool:'admin',
dx:{opts:["The Klaviyo back-in-stock theme embed was left off after the theme switch","Klaviyo API keys were revoked","MX records are wrong","Customers aren't really signing up"],a:0,why:"Sign-up POSTs can still work from a cached snippet while the embed that ties inventory events is disabled on the new theme."},
fix:{opts:["Enable the Klaviyo embed on the live theme, trigger a test restock, confirm the flow receives the event, then watch one real product","Rebuild the flow from scratch","Move back to the old theme permanently","Ask customers to email instead"],a:0,why:"Embed on + test restock proves the pipe without a risky theme rollback."},
hidden:"Owen can turn embeds on himself if talked through it. He'd rather we do it. About 30 minutes of overage is fine.",
model:"Hi Owen,\n\nThe sign-up form was still posting, but after Friday's theme switch the Klaviyo back-in-stock embed on the live theme was off, so restock events never reached your flow.\n\nI'll switch the embed on, run a test restock, and confirm Klaviyo receives it. About 30 minutes — you're over the care plan, so that would be £20 at £40/hr. Say the word and I'll do it today.\n\nBest,\nAlex",
learn:"After a theme switch, re-check theme app embeds. A flow can show Live while its storefront embed is off.",url:"https://help.klaviyo.com/hc/en-us/articles/115005080347"}
,{id:'b11',channel:'call',desk:'Agency desk',p:'WordPress',area:'Plugins & WooCommerce',client:'Cedar Hall Museum Shop',from:'Imogen Rees, Retail Lead',subject:'Sale prices show ex-VAT to the public',plan:'Support retainer · 4 hrs/month · 2 used',site:'shop.cedarhallmuseum.org.uk · WooCommerce',pri:'High',bill:'covered',

,{id:'b12',channel:'chat',desk:'Freelance',p:'Shopify',area:'DNS, domains & email',client:'Little Beam Studio',from:'Nia Gethin, Owner',subject:'Transactional email going to spam since Google Workspace move',plan:'Ad-hoc · £40/hr',site:'littlebeam.studio · Shopify',pri:'Normal',bill:'adhoc',

key:{opts:["Order email hits spam since the Google Workspace move on Monday","She tried adding Shopify SPF includes","Customers still get the mail, but in spam","It's transactional order mail"],a:0},
ev:{site:"Nothing relevant.",logs:"Shopify › Notifications: delivered\nGmail header: spf=fail smtp.mailfrom=shops.shopify.com",admin:"Domains › littlebeam.studio: Shopify email sender not verified",code:"Nothing relevant.",dns:"TXT @ \"v=spf1 include:_spf.google.com ~all\"\n(missing include:shops.shopify.com)\nDKIM: google._domainkey present; Shopify DKIM CNAME missing"},keyTool:'dns',

  <table class="parts">${P.map(p=>`<tr><td>${esc(p[0])}${p[1]<p[2]?`<div class="miss note">${esc(p[3])}</div>`:''}</td><td class="${p[1]===p[2]?'hit':'miss'}">${p[1]}/${p[2]}</td></tr>`).join('')}<tr><td>Client reply</td><td>${rp==null?'…':rp+'/8'}</td></tr></table>
  ${replyBlock}
  <details ${x.done.state==='self'?'open':''}><summary>Model reply</summary><p class="body" style="font-size:15px">${esc(t.model)}</p></details>
  ${x.done.state==='final'?`<p class="note"><b>Takeaway:</b> ${esc(t.learn)}</p>${/^https:\/\//.test(t.url||'')?`<p class="note"><a href="${esc(t.url)}" target="_blank" rel="noopener">Read more</a></p>`:''}<button class="btn w desk-submit" id="next">${S.queue.length?'Next ticket':'Finish'}</button>`:''}`}

function renderMbar(){const bar=$('#mbar');if(!bar)return;
  if(!isPhone()||mview==='queue'){bar.hidden=true;bar.innerHTML='';return}
  bar.hidden=false;const t=find(cur),x=t&&w(t.id);
  let html='';
  if(mview==='work'&&x&&!x.done){
    if(x.rstep==='reply')html=`<button type="button" class="btn ghost" data-act="to-triage">Back</button><button type="button" class="btn" data-act="submit">Send and resolve</button>`;
    else html=`<button type="button" class="btn" data-act="to-reply">Continue to reply</button>`;
  }else if(mview==='score'&&x&&x.done){
    if(x.done.state==='self')html=`<button type="button" class="btn" data-act="selfok">Confirm reply score</button>`;
    else if(x.done.state==='learn')html=`<button type="button" class="btn" data-act="gotit">Got it — continue</button>`;
    else html=`<button type="button" class="btn" data-act="next">${S.queue.length?'Next ticket':'Finish'}</button>`;
  }
  bar.innerHTML=html}

function renderFoot(){const wk=weakest();const due=dueCount();
  const sk=AREAS.map(a=>{const r=S.areas[a],p=areaPct(a);return `<div class="sk"><span>${esc(a)}</span><div class="bar"><i style="width:${p==null?0:Math.round(p*100)}%"></i></div><b>${p==null?'–':Math.round(p*100)+'%'}</b></div>`}).join('');
  const body=`<div><h2>Skills</h2>${sk}<p class="hintline">Next focus: ${esc(wk)}. Queue never repeats a ticket; fresh ones keep coming for weak areas.</p></div>
  <div><h2>Career path · UK salary</h2><ol class="certs">${CERTS.map(c=>`<li class="${S.resolved>=c[0]?'got':''}"><span>${esc(c[1])} · ${fmtBand(c)}</span><span>${c[0]} tickets</span></li>`).join('')}</ol><p class="hintline">Title jumps at ticket thresholds; the £ midpoint drifts with average score and streak.</p></div>
  <div><h2>Recent tickets</h2><ul class="hist">${S.hist.slice(0,8).map(h=>`<li><span>${esc(h.s)}</span><b>${h.g}/25</b></li>`).join('')||'<li><span>Resolve a ticket to start your record.</span></li>'}</ul></div>`;
  $('#foot').innerHTML=`<details class="sheet monly"><summary>Skills, career path and recent tickets</summary><div class="sheet-body foot-inner">${body}</div></details><div class="foot-desk">${body}</div>`}

function render(){
  if(!cur)mview='queue';
  else if(isPhone()){
    const x=W[cur];
    if(x&&x.done)mview='score';
    else if(mview==='score')mview='work';
  }else mview='work';
  setMview(mview);renderHdr();renderCtx();renderQueue();renderWork();renderFoot();window.scrollTo(0,0)}

function goMview(v){const t=find(cur),x=t&&w(t.id);
  if(v==='queue'){mview='queue';setMview(mview);renderQueue();renderMbar();window.scrollTo(0,0);return}
  if(!t)return;
  if(v==='work'){mview=x&&x.done?'score':'work'}
  else if(v==='score'){if(x&&x.done)mview='score';else return}
  else return;
  setMview(mview);renderWork();window.scrollTo(0,0)}

function recordJournal(t,tot,misses){const days=spacedDays(tot);const dueAt=Date.now()+days*864e5;
  /* Store area/channel only — due practice mints a NEW ticket in that area (never the same subject) */
  const key=t.area+'|'+(t.channel||'desk');
  S.journal[key]={score:tot,misses:misses.map(m=>m.title),dueAt,at:Date.now(),area:t.area,channel:t.channel||'desk',n:((S.journal[key]||{}).n||0)+1}}

function finishTicket(t,x){const tot=x.done.parts.reduce((a,p)=>a+p[1],0)+(x.done.reply||0);
  S.resolved++;S.sum+=tot;S.max+=25;const r=S.areas[t.area]||(S.areas[t.area]={s:0,m:0,n:0});r.s+=tot;r.m+=25;r.n++;
  const d=today();if(S.lastDay!==d){const y=new Date(Date.now()-864e5).toLocaleDateString('en-CA');S.streak=S.lastDay===y?(S.streak||0)+1:1;S.lastDay=d}
  S.hist.unshift({s:t.subject,a:t.area,g:tot,ch:t.channel||'desk',at:Date.now()});S.hist=S.hist.slice(0,60);
  markSeen(t);
  recordJournal(t,tot,x.done.misses||[]);
  DONE[t.id]=t;S.queue=S.queue.filter(q=>q.id!==t.id);
  refillQueue(3);
  x.done.state='final';save()}

document.addEventListener('click',e=>{const el=e.target.closest('button,[data-open]');if(!el)return;
  if(el.dataset.open){cur=el.dataset.open;w(cur).rstep='triage';mview='work';render();return}
  if(el.dataset.mview){goMview(el.dataset.mview);return}
  const t=find(cur),x=t&&w(t.id);
  const act=el.dataset.act||el.id;
  if(el.dataset.tab&&x){x.tab=el.dataset.tab;if(!x.tools.includes(x.tab))x.tools.push(x.tab);renderWork();return}
  if(act==='practice'){const add=buildPractice(S.queue.length?3:6);for(const t0 of add){if(!S.queue.some(q=>q.id===t0.id||q.subject===t0.subject))S.queue.push(t0)}
    if(!cur&&S.queue[0])cur=S.queue[0].id;mview=cur?'work':'queue';save();render();return}
  if(act==='to-reply'&&t){
    if([x.key,x.pri,x.bill,x.dx,x.fix].some(v=>v==null)){x.err='Answer every question first.';renderRes(t,x);renderMbar();
      if(isPhone()){const a=$('#resolve-anchor');if(a)a.scrollIntoView({behavior:'smooth',block:'start'})}
      return}
    x.err='';x.rstep='reply';mview='work';setMview(mview);renderWork();window.scrollTo(0,0);return}
  if(act==='to-triage'&&t){x.rstep='triage';mview='work';setMview(mview);renderWork();
    if(isPhone()){requestAnimationFrame(()=>{const a=$('#resolve-anchor');if(a)a.scrollIntoView({behavior:'smooth',block:'start'})})}
    return}
  if(act==='submit'&&t){const ta=$('#reply');if(ta)x.reply=ta.value;
    if([x.key,x.pri,x.bill,x.dx,x.fix].some(v=>v==null)){x.err='Answer every question first.';x.rstep='triage';mview='work';renderWork();
      if(isPhone()){$('#resolve-anchor')?.scrollIntoView({behavior:'smooth',block:'start'})}
      return}
    if(x.reply.trim().length<60){x.err='Write a fuller reply to the client.';x.rstep='reply';mview='work';setMview(mview);renderWork();
      if(isPhone()){requestAnimationFrame(()=>$('#reply')?.scrollIntoView({behavior:'smooth',block:'center'}))}
      return}
    const P=parts(t,x);x.err='';x.done={parts:P,reply:null,fb:null,misses:missList(P),state:'self',at:Date.now()};mview='score';render();return}
  if(act==='selfok'&&t){x.done.reply=[...document.querySelectorAll('input[name=self]:checked')].length;
    if((x.done.misses||[]).length){x.done.state='learn';mview='score';render();return}
    finishTicket(t,x);mview='score';render();return}
  if(act==='gotit'&&t){finishTicket(t,x);mview='score';render();return}
  if(act==='next'){refillQueue(3);if(S.queue.length){cur=S.queue[0].id;w(cur).rstep='triage';mview='work';render()}else{S.queue=buildPractice(6);cur=S.queue[0]?.id||null;mview=cur?'work':'queue';save();render()}}
});
document.addEventListener('change',e=>{const t=find(cur);if(!t)return;const x=w(t.id),n=e.target.name,v=e.target.value;
  if(n==='key'||n==='dx'||n==='fix')x[n]=+v;else if(n==='pri'||n==='bill')x[n]=v});
document.addEventListener('input',e=>{const t=find(cur);if(!t)return;const x=w(t.id);if(e.target.id==='reply')x.reply=e.target.value;if(e.target.id==='chatq')x.q=e.target.value});
document.addEventListener('submit',e=>{if(e.target.id!=='chatf')return;e.preventDefault();const t=find(cur);if(!t)return;const x=w(t.id);
  const q=(x.q||'').trim();if(!q||x.done)return;if(x.chat.filter(m=>m.r==='me').length>=5)return;
  x.chat.push({r:'me',t:q});x.q='';x.chat.push({r:'cl',t:scriptReply(t,q)});renderWork()});
const tick=setInterval(()=>{const t=find(cur);if(!t||!W[t.id]||W[t.id].done)return;const s=fmtT(Date.now()-W[t.id].start);
  document.querySelectorAll('#timer,#timer-m').forEach(el=>{el.textContent=s})},1000);
matchMedia('(max-width:760px)').addEventListener('change',()=>render());

setMview(mview);render();
}
</script></body></html>
